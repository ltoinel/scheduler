name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run lint

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npm run coverage # fails under 90% line coverage
      - uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/

  # Publishes the coverage badge to the "badges" branch (read by shields.io).
  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [lint, test, coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage
          path: coverage
      - name: Push badge to the badges branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git init -q badges && cd badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp ../coverage/coverage-badge.json coverage.json
          git checkout -q -b badges
          git add coverage.json
          git commit -q -m "Update coverage badge"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" badges
