<script type="text/html" data-template-name="scheduler">
	<div class="form-row">
		<label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
		<input type="text" id="node-input-name" placeholder="Name">
	</div>

	<div class="form-row">
		<label for="node-input-starttime"><i class="fa fa-clock-o"></i> On Time</label>
		<select id="node-input-starttime" style="width:70%"></select>
	</div>

	<div class="form-row">
		<label for="node-input-endtime"><i class="fa fa-clock-o"></i> Off Time</label>
		<select id="node-input-endtime" style="width:70%"></select>
	</div>

	<div class="form-row">
		<label for="node-input-dawnoff"><i class="fa fa-clock-o"></i> Dawn Offset</label>
		<input type="text" id="node-input-dawnoff" placeholder="0" style="width:80px"> mins
	</div>

	<div class="form-row">
		<label for="node-input-duskoff"><i class="fa fa-clock-o"></i> Dusk Offset</label>
		<input type="text" id="node-input-duskoff" placeholder="0" style="width:80px"> mins
	</div>

	<div class="form-row">
		<label for="node-input-lat"><i class="fa fa-globe"></i> Latitude</label>
		<input type="text" id="node-input-lat" placeholder="51.025">
	</div>

	<div class="form-row">
		<label for="node-input-lon"><i class="fa fa-globe"></i> Longitude</label>
		<input type="text" id="node-input-lon" placeholder="-1.4">
	</div>

	<div class="form-row">
		<label for="node-input-outtopic"><i class="fa fa-tasks"></i> Topic</label>
		<input type="text" id="node-input-outtopic" placeholder="MQTT Topic">
	</div>

	<div class="form-row">
		<label for="node-input-outpayload1"><i class="fa fa-toggle-on"></i> ON Msg</label>
		<input type="text" id="node-input-outpayload1" placeholder="MQTT Payload">
	</div>

	<div class="form-row">
		<label for="node-input-outpayload2"><i class="fa fa-toggle-off"></i> OFF Msg</label>
		<input type="text" id="node-input-outpayload2" placeholder="MQTT Payload">
	</div>

	<style>
		.scheduler-checks span { display:inline-block; width:55px; margin-left:5px; }
		.scheduler-checks input[type=checkbox] { width:auto; vertical-align:top; margin:2px 4px 0 0; }
	</style>

	<div class="form-row scheduler-checks">
		<label><i class="fa fa-calendar"></i> Days</label>
		<div style="display:inline-block; width:70%">
			<span><input type="checkbox" id="node-input-mon">Mon</span>
			<span><input type="checkbox" id="node-input-tue">Tue</span>
			<span><input type="checkbox" id="node-input-wed">Wed</span>
			<span><input type="checkbox" id="node-input-thu">Thu</span>
			<span><input type="checkbox" id="node-input-fri">Fri</span>
			<span><input type="checkbox" id="node-input-sat">Sat</span>
			<span><input type="checkbox" id="node-input-sun">Sun</span>
		</div>
	</div>

	<div class="form-row scheduler-checks">
		<label><i class="fa fa-calendar"></i> Months</label>
		<div style="display:inline-block; width:70%">
			<span><input type="checkbox" id="node-input-jan">Jan</span>
			<span><input type="checkbox" id="node-input-feb">Feb</span>
			<span><input type="checkbox" id="node-input-mar">Mar</span>
			<span><input type="checkbox" id="node-input-apr">Apr</span>
			<span><input type="checkbox" id="node-input-may">May</span>
			<span><input type="checkbox" id="node-input-jun">Jun</span>
			<span><input type="checkbox" id="node-input-jul">Jul</span>
			<span><input type="checkbox" id="node-input-aug">Aug</span>
			<span><input type="checkbox" id="node-input-sep">Sep</span>
			<span><input type="checkbox" id="node-input-oct">Oct</span>
			<span><input type="checkbox" id="node-input-nov">Nov</span>
			<span><input type="checkbox" id="node-input-dec">Dec</span>
		</div>
	</div>
</script>

<script type="text/html" data-help-name="scheduler">
	<p>Turns something on and off according to a schedule based on fixed times,
	dawn/dusk (computed with the <code>suncalc</code> module), days of the week and months.
	The schedule is evaluated every minute.</p>
	<h3>Outputs</h3>
	<ol class="node-ports">
		<li>Change
			<dl class="message-properties">
				<dt>topic <span class="property-type">string</span></dt>
				<dd>the configured topic.</dd>
				<dt>payload <span class="property-type">string</span></dt>
				<dd>the ON or OFF message. Sent only when the state changes
				or when the button of the node is pressed.</dd>
			</dl>
		</li>
		<li>Status
			<dl class="message-properties">
				<dt>topic <span class="property-type">string</span></dt>
				<dd><code>status</code></dd>
				<dt>payload <span class="property-type">string</span></dt>
				<dd><code>"1"</code> when on, <code>"0"</code> when off. Sent every minute.</dd>
			</dl>
		</li>
	</ol>
	<h3>Details</h3>
	<p>The node is on from <i>On Time</i> (included) until <i>Off Time</i> (excluded).
	The period may cross midnight. <i>Off Time</i> can also be a duration counted from <i>On Time</i>.</p>
	<p>The Dawn and Dusk offsets can be positive for minutes later or negative for minutes earlier.</p>
	<p>Times are based on the local time zone of the Node-RED server.</p>
	<p>Nothing is sent on output 1 at start-up: the first evaluation only initialises the state.</p>
</script>

<script type="text/javascript">
(function () {
	function pad(n) { return (n < 10 ? "0" : "") + n; }

	function fillTimes(select, withDurations) {
		select.empty();
		for (var m = 0; m < 1440; m += 15) {
			select.append($("<option>").val(String(m)).text(pad(Math.floor(m / 60)) + ":" + pad(m % 60)));
		}
		select.append($("<option>").val("5000").text("Dawn"));
		select.append($("<option>").val("6000").text("Dusk"));
		if (withDurations) {
			[1, 2, 5, 10, 15, 30, 60, 90, 120].forEach(function (d) {
				select.append($("<option>").val(String(10000 + d)).text(d + (d === 1 ? " minute" : " minutes")));
			});
		}
	}

	// Values stored by older versions of this node for 21:45 -> 23:45 were wrong.
	var LEGACY_TIMES = {
		"1315": "1305", "1330": "1320", "1345": "1335", "1360": "1350", "1375": "1365",
		"1390": "1380", "1405": "1395", "1420": "1410", "1435": "1425"
	};
	function fixLegacy(v) {
		v = String(v);
		return LEGACY_TIMES.hasOwnProperty(v) ? LEGACY_TIMES[v] : v;
	}

	function validateTime(v) {
		var t = parseInt(fixLegacy(v), 10);
		return (t >= 0 && t < 1440 && t % 15 === 0) || t === 5000 || t === 6000 ||
			[10001, 10002, 10005, 10010, 10015, 10030, 10060, 10090, 10120].indexOf(t) !== -1;
	}

	RED.nodes.registerType("scheduler", {
		category: "input",
		color: "#6699ff",
		defaults: {
			name: { value: "My Scheduler" },
			outtopic: { value: "" },
			outpayload1: { value: "" },
			outpayload2: { value: "" },
			lat: { value: "", required: true, validate: RED.validators.number() },
			lon: { value: "", required: true, validate: RED.validators.number() },
			start: { value: "sunrise", required: true },
			end: { value: "sunset", required: true },
			starttime: { value: "5000", required: true, validate: validateTime },
			endtime: { value: "1425", required: true, validate: validateTime },
			duskoff: { value: "0", required: true, validate: RED.validators.number() },
			dawnoff: { value: "0", required: true, validate: RED.validators.number() },
			sun: { value: true },
			mon: { value: true },
			tue: { value: true },
			wed: { value: true },
			thu: { value: true },
			fri: { value: true },
			sat: { value: true },
			jan: { value: true },
			feb: { value: true },
			mar: { value: true },
			apr: { value: true },
			may: { value: true },
			jun: { value: true },
			jul: { value: true },
			aug: { value: true },
			sep: { value: true },
			oct: { value: true },
			nov: { value: true },
			dec: { value: true }
		},
		inputs: 0,
		outputs: 2,
		outputLabels: ["change", "status"],
		icon: "scheduler.svg",
		label: function () {
			return this.name || "scheduler";
		},
		labelStyle: function () {
			return this.name ? "node_label_italic" : "";
		},
		oneditprepare: function () {
			var start = $("#node-input-starttime");
			var end = $("#node-input-endtime");
			fillTimes(start, false);
			fillTimes(end, true);
			start.val(fixLegacy(this.starttime || "5000"));
			end.val(fixLegacy(this.endtime || "1425"));

			if ($("#node-input-lat").val() === "" && $("#node-input-lon").val() === "") {
				if ("geolocation" in navigator) {
					navigator.geolocation.getCurrentPosition(function (position) {
						$("#node-input-lat").val(Number(position.coords.latitude.toFixed(5)));
						$("#node-input-lon").val(Number(position.coords.longitude.toFixed(5)));
					});
				}
			}
		},
		button: {
			onclick: function () {
				var label = this.name || "scheduler";
				$.ajax({
					url: "scheduler/" + this.id,
					type: "POST",
					success: function () {
						RED.notify("Successfully injected: " + label, "success");
					},
					error: function (jqXHR, textStatus) {
						if (jqXHR.status == 404) {
							RED.notify("<strong>Error</strong>: scheduler node not deployed", "error");
						} else if (jqXHR.status == 500) {
							RED.notify("<strong>Error</strong>: scheduler reset failed, see log for details.", "error");
						} else if (jqXHR.status == 0) {
							RED.notify("<strong>Error</strong>: no response from server", "error");
						} else {
							RED.notify("<strong>Error</strong>: unexpected error: (" + jqXHR.status + ") " + textStatus, "error");
						}
					}
				});
			}
		}
	});
})();
</script>
